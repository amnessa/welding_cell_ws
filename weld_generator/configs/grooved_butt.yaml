# Phase 6b step 4 - grooved butt joints (D35). The thickness range reaches past 12 mm
# so every preparation row is reachable, single-U included; valid_preps(t) correlates
# preparation with thickness BY DESIGN (state in the paper).
name: grooved_butt
joint_type: [butt]
seam_shape: line
prep: square
fixture_present: false
sampling_mode: area_uniform
sensor_profiles: [d435i, stereo_good, stereo_poor]
thickness_mm: [3.0, 20.0]
groove_preps: true
class_disjoint: true
# D28 anti-shortcut mechanisms ON (2026-09-07). The config predated Phase 6a's keys,
# AND the groove constructor discarded the outline draws it received - so through
# out/bench_phase4 the grooved stratum was the one rectangular plate left (mech none,
# 100% terminal mass; tipped the pooled plate gate to FAIL at 60 scenes). Grooved plates
# are now `prepared_prism` (outline + ISO 9692-1 profile). Geometry keys: every scene of
# this config is re-identified.
in_plane_yaw: true
polygon_outlines: true
